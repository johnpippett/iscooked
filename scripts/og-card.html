<!doctype html>
<!-- Source for site/assets/og-card-v2.png. Render with scripts/render_og_card.sh. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../site/assets/fonts/archivo-latin.woff2") format("woff2");
    font-weight: 100 900;
    font-stretch: 62% 125%;
  }
  @font-face {
    font-family: "Martian Mono";
    src: url("../site/assets/fonts/martian-mono-latin.woff2") format("woff2");
    font-weight: 100 800;
  }
  :root {
    --bg: #f4f2ec;
    --ink: #1d1e1b;
    --muted: #5b5e56;
    --line: #d4d2c7;
    --accent: #c8381a;
    --term-bg: #1b1d1a;
    --term-raised: #252823;
    --term-line: #3a3d37;
    --term-fg: #e9e8df;
    --term-muted: #9ea397;
    --critical: #ff7a68;
    --warning: #f0c35a;
    --passed: #9fd3a8;
    --heat: linear-gradient(90deg, #86c8d6 0%, #9fd3a8 15%, #f0c35a 40%, #f08a3c 70%, #c8381a 100%);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: var(--bg); }
  body {
    position: relative;
    font-family: "Archivo", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  .wordmark {
    position: absolute; left: 64px; top: 52px;
    font-weight: 800; font-size: 44px; letter-spacing: -0.04em; line-height: 1;
  }
  .wordmark b { color: var(--accent); font-weight: 800; }

  h1 {
    position: absolute; left: 60px; top: 168px;
    font-weight: 800; font-size: 98px; line-height: 0.9; letter-spacing: -0.04em;
  }
  h1 span { display: block; }
  h1 .hot { color: var(--accent); }

  .foot {
    position: absolute; left: 64px; top: 474px;
    font-family: "Martian Mono", monospace; font-size: 19px; color: var(--muted);
    letter-spacing: 0;
  }
  .foot strong { color: var(--ink); font-weight: 600; }

  /* The product shot: the terminal plate, cropped by the right edge like the hero. */
  .term {
    position: absolute; left: 712px; top: 92px; width: 600px; height: 600px;
    background: var(--term-bg);
    border: 1px solid #10110f;
    border-radius: 14px;
    box-shadow: 0 30px 60px -20px rgba(29, 30, 27, 0.45), 0 8px 18px -8px rgba(29, 30, 27, 0.3);
    overflow: hidden;
  }
  .bar {
    height: 50px; display: flex; align-items: center; gap: 9px; padding: 0 20px;
    background: var(--term-raised); border-bottom: 1px solid var(--term-line);
  }
  .bar i { width: 12px; height: 12px; border-radius: 50%; background: #3f423b; }
  .body {
    padding: 26px 28px;
    font-family: "Martian Mono", monospace; font-size: 18px; line-height: 1.5;
    color: var(--term-fg); white-space: pre;
  }
  .row { display: block; }
  .gap { height: 16px; }
  .dim { color: var(--term-muted); }
  .c { color: var(--critical); font-weight: 700; }
  .w { color: var(--warning); font-weight: 700; }
  .p { color: var(--passed); font-weight: 700; }
  .score { display: flex; align-items: baseline; gap: 14px; }
  .score b { font-family: "Archivo", sans-serif; font-weight: 800; font-size: 64px; line-height: 1; letter-spacing: -0.03em; color: #f08a3c; }
  .meter { display: block; margin-top: 14px; width: 440px; height: 12px; border-radius: 6px; background: var(--term-line); overflow: hidden; }
  .meter span { display: block; width: 28%; height: 100%; background: var(--heat); background-size: 440px 100%; }
</style>
</head>
<body>
  <div class="wordmark">iscooked<b>.</b></div>

  <h1><span>Your AI</span><span>is local.</span><span class="hot">Is it cooked?</span></h1>

  <p class="foot"><strong>curl | bash</strong> · local scan · no telemetry</p>

  <div class="term" aria-hidden="true">
    <div class="bar"><i></i><i></i><i></i></div>
    <div class="body"><span class="row"><span class="c">COOKED</span>  /srv/models is world-writable</span><span class="gap row"></span><span class="row"><span class="w">WARMING UP</span>  Ollama API needs no auth</span><span class="gap row"></span><span class="row"><span class="p">SAFE</span>  UFW firewall is active</span><span class="gap row"></span><span class="gap row"></span><span class="row dim">YOUR COOKED SCORE</span><span class="row score"><b>28%</b><span class="dim">slightly warm</span></span><span class="row"><span class="meter"><span></span></span></span></div>
  </div>
</body>
</html>
