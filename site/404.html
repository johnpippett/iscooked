<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="theme-color" content="#f5f4ef" />
    <title>Page not found — iscooked</title>
    <link
      rel="icon"
      type="image/webp"
      href="/assets/iscooked-logo-256-v1.webp"

        <a class="button button-primary" href="/"

    <footer class="container site-footer">
      <a class="brand footer-brand" href="/"
        >iscooked<span class="brand-dot">.</span></a
      >
      <p>Built by <a href="https://pippett.me/">pippett.me</a></p>
